apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: demo
  labels: { app: catalog-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog-api }
  template:
    metadata:
      labels: { app: catalog-api }
    spec:
      containers:
        - name: catalog-api
          image: alboner/plurasight-project:catalog-api
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: Otlp__Endpoint, value: "http://otel-collector:4317" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: demo
spec:
  selector: { app: catalog-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
