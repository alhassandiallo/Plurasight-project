apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: demo
  labels: { app: basket-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: basket-api }
  template:
    metadata:
      labels: { app: basket-api }
    spec:
      containers:
        - name: basket-api
          image: alboner/plurasight-project:basket-api
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: Otlp__Endpoint, value: "http://otel-collector:4317" }
            - { name: Catalog__BaseUrl, value: "http://catalog:8080" }
            - { name: RabbitMQ__Host, value: "rabbitmq" }
            - name: RabbitMQ__Username
              valueFrom: { secretKeyRef: { name: rabbitmq-credentials, key: username } }
            - name: RabbitMQ__Password
              valueFrom: { secretKeyRef: { name: rabbitmq-credentials, key: password } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: basket
  namespace: demo
spec:
  selector: { app: basket-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
