apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-worker
  namespace: demo
  labels: { app: service-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: service-worker }
  template:
    metadata:
      labels: { app: service-worker }
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]
      containers:
        - name: service-worker
          image: alboner/plurasight-project:service-worker
          env:
            - { name: Otlp__Endpoint, value: "http://otel-collector:4317" }
            - { name: Catalog__BaseUrl, value: "http://catalog:8080" }
            - { name: RabbitMQ__Host, value: "rabbitmq" }
            - name: RabbitMQ__Username
              valueFrom: { secretKeyRef: { name: rabbitmq-credentials, key: username } }
            - name: RabbitMQ__Password
              valueFrom: { secretKeyRef: { name: rabbitmq-credentials, key: password } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
