# The ConfigMap "otel-collector-config" is created by scripts/deploy.sh from k8s/otel-collector-config.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: demo
  labels: { app: otel-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.116.1
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: prom-metrics, containerPort: 8889 }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
          readinessProbe:
            httpGet: { path: /, port: 13133 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: demo
  labels: { app: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: prom-metrics, port: 8889, targetPort: prom-metrics }
